name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx -y markdownlint-cli2 "**/*.md"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: benefits_dev
          POSTGRES_DB: benefits_navigator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:benefits_dev@localhost:5432/benefits_navigator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest tests/ -q
      - run: python3 -m mypy scripts/ tests/

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: benefits_dev
          POSTGRES_DB: benefits_navigator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:benefits_dev@localhost:5432/benefits_navigator
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The pinned git-hosted @nationaldesignstudio/rampart dependency builds
      # its dist through a bun prepack during install (the pnpm-workspace
      # allowlist grants it), so bun must exist before pnpm install. pnpm's
      # prepare step shells out to `npm install` inside that package, and
      # Node 22's bundled npm 10.9.x crashes in its arborist peer resolver
      # (npm/cli #9960); npm 11 resolves the same tree cleanly (verified with
      # the exact versions).
      # Pinned so the fork's bun prepack stays reproducible (review P3): a
      # floating bun release can change or break the build with no repo
      # change. Rampart's own CI pins the same version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm install -g npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  app-vercel-sim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: benefits_dev
          POSTGRES_DB: benefits_navigator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:benefits_dev@localhost:5432/benefits_navigator
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Vercel cold-store simulation (HACK-107): Vercel builds on Node 22 with
      # no bun on PATH, its bundled npm 10.9.x, and a cold pnpm store. pnpm
      # re-prepares source-only git-tarball dependencies on every cold install
      # (pnpm 10.34.9 exec/prepare-package: preferred-pm picks npm for the
      # unrecognized text bun.lock, Node 22 bundled npm dies in arborist
      # #loadPeerSet (npm/cli #9960), and a surviving install still needs bun
      # for prepack). This job keeps the app job dependencies/service but drops
      # the bun step, the npm 11 pin, and the pnpm store cache to hold exactly
      # the constraints that produced the oomReport on the 2-core/8 GB builder,
      # then runs the same production build Vercel runs, so a source-only pin
      # fails CI before it can break a Vercel deploy.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
