name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx -y markdownlint-cli2 "**/*.md"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: benefits_dev
          POSTGRES_DB: benefits_navigator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:benefits_dev@localhost:5432/benefits_navigator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest tests/ -q
      - run: python3 -m mypy scripts/ tests/

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: benefits_dev
          POSTGRES_DB: benefits_navigator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:benefits_dev@localhost:5432/benefits_navigator
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Test files mutate process.env.DATABASE_URL to point at their own
      # scratch databases; on CI runners the parallel forks have been seen
      # to interleave that env state and hang indefinitely. Run the files
      # serially with hard timeouts so any stall fails with a name instead
      # of hanging the job.
      - run: >-
          pnpm vitest run --no-file-parallelism
          --test-timeout=20000 --hook-timeout=20000 --teardown-timeout=20000
      - run: pnpm build
