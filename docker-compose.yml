services:
  postgres:
    image: postgres:17-alpine
    container_name: benefits-navigator-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: benefits_dev
      POSTGRES_DB: benefits_navigator
    ports:
      - "5432:5432"
    volumes:
      - benefits_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  benefits_pgdata:
